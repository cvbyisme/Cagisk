name: Cagisk Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build Cagisk (arm64 debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: "true"

      - name: Build native binaries
        run: python build.py -v -c .github/ci.prop native

      - name: Build app
        run: python build.py -v -c .github/ci.prop app

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Show outputs
        run: ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cagisk-apk-${{ github.sha }}
          path: out/*.apk
          compression-level: 9
